name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Ações pinnadas por commit SHA + tag de referência no comentário
      # (fio-DA): tag móvel @v4 seria ponto único de comprometimento no CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (deps de runtime)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Estrutura (ciclos + tamanho de arquivo)
        run: npm run check:structure
      - name: Testes + piso de cobertura
        run: npm run coverage
      - run: npm run build
