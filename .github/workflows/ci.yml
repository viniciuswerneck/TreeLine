name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Ações pinnadas por commit SHA + tag de referência no comentário
      # (fio-DA): tag móvel @v4 seria ponto único de comprometimento no CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit (deps de runtime)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Estrutura (ciclos + tamanho de arquivo)
        run: npm run check:structure
      - name: Testes + piso de cobertura
        run: npm run coverage
      - run: npm run build
