appId: dev.treeline.app
productName: TreeLine
# node-pty carrega .node via dlopen: fora do asar (dentro não abre).
asarUnpack:
  - "**/*.node"
directories:
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/splash.jpg
    to: splash.jpg
linux:
  category: Development
  # "treeline" tambem e o binario do pacote Ubuntu (gerenciador de dados).
  # Nome proprio evita roubar /usr/bin/treeline via update-alternatives.
  executableName: treeline-git-gui
  icon: build/icon.png
  syncDesktopName: true
  target:
    - deb
    - AppImage
deb:
  packageCategory: devel
  # "treeline" ja e um pacote do Ubuntu universe (gerenciador de dados, v3.1.5).
  # Nome proprio evita sobrescrever/remover aquele pacote no dpkg.
  packageName: treeline-git-gui
