appId: dev.treeline.app
productName: TreeLine
# node-pty carrega .node via dlopen: fora do asar (dentro não abre).
asarUnpack:
  - "**/*.node"
directories:
  output: dist
files:
  - out/**/*
  - package.json
linux:
  category: Development
  executableName: treeline
  icon: build/icon.png
  syncDesktopName: true
  target:
    - deb
    - AppImage
deb:
  packageCategory: devel
